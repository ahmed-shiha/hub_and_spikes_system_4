
name: Monitor Production STP Model
on:
  schedule:
    - cron: '0 10 * * *' # Run at 10 AM UTC every day
  workflow_dispatch:
jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python & Install Dependencies
        run: |
          pip install -r ml_hub/stp_automation_model_v1/requirements.txt
          pip install -e ml_hub/medins_ml_utils --no-deps
      - name: Run Production Drift Check
        working-directory: ./ml_hub/stp_automation_model_v1
        run: |
          # In a real system, this would download the latest prediction logs first
          python monitoring/check_production_drift.py
